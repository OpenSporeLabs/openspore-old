[package]
name = "spore-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The OpenSpore runtime: a Bevy application that loads and renders real Spore assets."

[features]
# Development-only. `brp` adds the Bevy Remote Protocol bridge
# (`bevy_brp_extras`), which is what `bevy_brp_mcp` drives so a coding agent can
# inspect and mutate a *running* `openspore`, screenshot it, inject input and
# shut it down.
#
# It is OFF by default and that is the point: enabling it opens an HTTP
# listener and pulls `bevy_remote` (plus its UI/text/sprite dependencies) into
# the bevy feature union. Nothing about a debug bridge belongs in a shipped
# build, and enabling it by feature rather than by an env var keeps it out of
# the dependency graph of the hermetic `cargo test --workspace`.
#
#   cargo run -p spore-engine --features brp -- --placeholder
#
# Bumped in lockstep with `bevy_brp_mcp`; both must target the same Bevy minor.
# See docs/BRP.md.
brp = ["dep:bevy_brp_extras"]

[dependencies]
spore-core = { workspace = true }
spore-assets = { workspace = true }
spore-gmdl = { workspace = true }
spore-texture = { workspace = true }
spore-material = { workspace = true }
# The authoring source of truth. `spore-engine` is the runtime projection of a
# `CreatorDocument`, so it reads that document's own types rather than restating
# them. The dependency runs one way only: creator-core is Bevy-free and does not
# know this crate exists.
spore-creator-core = { workspace = true }
# The composition layer: a creator document resolved into parts, and the
# projection that turns that composition into placed geometry. `spore-engine` is
# the only place that consumes a projection, so this edge runs one way and
# `spore-morphology` stays Bevy-free (it is the projection's input, not its
# output). See docs/RUST-ENGINE.md §1.
spore-morphology = { workspace = true }
bevy = { workspace = true }
# Only ever reached through the `brp` feature above. 0.22.8 is the release that
# targets Bevy 0.19 (see extras/README.md compatibility table); 0.23.x is still
# `-dev` on the upstream main branch.
bevy_brp_extras = { version = "0.22.8", optional = true }

# Tests only. A corpus test needs to enumerate `<sporemodel>` records out of a
# package image, and `spore-assets` re-exports no package reader of its own --
# `ContentStore` is a resolved view, not an index. Dev-only so this never
# becomes a runtime edge.
[dev-dependencies]
spore-dbpf = { workspace = true }

# The shipped binary is `openspore`, not `spore-engine`. The crate is the
# engine; the binary is the game you launch, and every document, CI step and
# error message refers to it by that name. An earlier revision of this file lost
# the [[bin]] section, which silently renamed the binary to the crate name and
# left the docs referring to a program that did not exist -- so the rename is now
# asserted by `tests/binary_names.rs` and by CI.
[[bin]]
name = "openspore"
path = "src/main.rs"
