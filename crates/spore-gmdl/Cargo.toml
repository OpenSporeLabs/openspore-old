[package]
name = "spore-gmdl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "GMDL (GameModel) record decoder and static mesh extraction for Spore gmdl records."

[dependencies]
spore-core = { workspace = true }
thiserror = { workspace = true }

# Corpus tests only. Both are Bevy-free and GPU-free like the crate itself; they
# exist so the `refCount` endianness claim can be settled by *index resolution*
# against a real package instead of against this crate's own output.
[dev-dependencies]
spore-dbpf = { workspace = true }
spore-rw4 = { workspace = true }
# The bone-identity vocabulary (FNV-1 + the 244 recovered names) lives in
# spore-rigblock. This measurement histograms gmdl trailer words against it, and
# it must hash with *that* crate's `fnv1`: writing a second FNV-1 here is the one
# mistake that would make the whole measurement look clean and be wrong.
spore-rigblock = { workspace = true }